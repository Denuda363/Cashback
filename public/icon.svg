<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#34d399" stroke-width="6" />
  <!-- Card with Drop Shadow -->
  <g filter="url(#shadow)">
    <rect x="110" y="190" width="270" height="190" rx="28" fill="#ffffff" />
    <rect x="110" y="230" width="270" height="44" fill="#0f172a" />
    <rect x="140" y="315" width="48" height="34" rx="8" fill="#10b981" />
    <circle cx="216" cy="332" r="10" fill="#cbd5e1" />
    <circle cx="244" cy="332" r="10" fill="#cbd5e1" />
  </g>
  <!-- Golden Cashback Coin -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="175" r="76" fill="url(#coinGrad)" stroke="#b45309" stroke-width="5" />
    <circle cx="350" cy="175" r="62" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="8 6" />
    <!-- % Symbol -->
    <circle cx="330" cy="155" r="14" fill="#78350f" />
    <circle cx="370" cy="195" r="14" fill="#78350f" />
    <line x1="375" y1="145" x2="325" y2="205" stroke="#78350f" stroke-width="12" stroke-linecap="round" />
  </g>
  <!-- Sparkles -->
  <path d="M140 140 L146 120 L152 140 L172 146 L152 152 L146 172 L140 152 L120 146 Z" fill="#6ee7b7" />
  <path d="M90 280 L94 268 L98 280 L110 284 L98 288 L94 300 L90 288 L78 284 Z" fill="#a7f3d0" />
</svg>